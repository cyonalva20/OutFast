# ============================================================
# OutFast — Docker Compose para desarrollo local
# ============================================================
# Levanta los servicios en un solo comando:
#   docker compose up
#
# Puertos:
#   5173 → Frontend (Vite)
#   8080 → Backend Core (Spring Boot)
#   8000 → Backend AI (FastAPI)
# ============================================================

services:
  # ---- Backend Core (Java / Spring Boot) ----
  backend-core:
    build: ./backend-core
    container_name: outfast-core
    env_file:
      - ./backend-core/.env
    ports:
      - "8080:8080"

  # ---- Backend AI (Python / FastAPI) ----
  backend-ai:
    build: ./backend-ai
    container_name: outfast-ai
    env_file:
      - ./backend-ai/.env
    ports:
      - "8000:8000"

  # ---- Frontend (React / Vite) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outfast-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend-core
