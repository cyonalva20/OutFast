# ============================================================
# OutFast Backend Core — Configuración Principal
# ============================================================
# Este archivo contiene las propiedades que Spring Boot lee
# al arrancar. Los valores con ${VARIABLE} se leen de las
# variables de entorno del sistema (definidas en .env o en
# el hosting en producción).
# ============================================================

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Base de datos (PostgreSQL vía Supabase) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outfast}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" crea o modifica tablas automáticamente según las entidades Java.
# En producción se cambia a "validate" para no alterar la DB accidentalmente.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- URL del microservicio de IA (FastAPI) ---
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# --- Logging ---
logging.level.com.outfast=INFO
logging.level.org.springframework.security=WARN
